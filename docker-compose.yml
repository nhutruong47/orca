version: '3.8'

services:
  # Database Service
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: orca-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=12345
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - orca_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 12345 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orca-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://db:1433;databaseName=orca_db;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
      - SPRING_PROFILES_ACTIVE=prod
      # If you need to override other config, add them here
    depends_on:
      db:
        condition: service_healthy

  # Vite React Frontend Service
  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: orca-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  orca_sql_data:
